name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    name: Vet, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        # gofmt -l prints the files that need formatting; anything printed fails.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # -race because the cache and the HTTP handlers run concurrently, and a
      # data race there would surface as a wrong validation result under load.
      - run: go test ./... -race -coverprofile=coverage.out

      - run: go build ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

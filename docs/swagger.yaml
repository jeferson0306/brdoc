definitions:
  models.BatchItem:
    properties:
      id:
        description: |-
          ID is echoed back untouched so the caller can line results up with its
          own form fields without relying on ordering.
        type: string
      key:
        description: Key is the document type, matching the query parameter names
          of GET /validate.
        type: string
      qualifier:
        description: |-
          Qualifier carries the extra context a few documents need — today only the
          issuing state for an inscrição estadual.
        type: string
      value:
        type: string
    type: object
  models.BatchRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/models.BatchItem'
        type: array
    type: object
  models.BatchResponse:
    properties:
      error_code:
        type: string
      execution_time_ms:
        type: integer
      message:
        type: string
      request_id:
        type: string
      results:
        items:
          $ref: '#/definitions/models.BatchResult'
        type: array
      status_code:
        type: integer
      summary:
        $ref: '#/definitions/models.BatchSummary'
      timestamp:
        type: string
    type: object
  models.BatchResult:
    properties:
      error_code:
        type: string
      from_cache:
        type: boolean
      id:
        type: string
      is_valid:
        type: boolean
      key:
        type: string
      message:
        type: string
      raw_value:
        type: string
      value:
        type: string
    type: object
  models.BatchSummary:
    properties:
      invalid:
        type: integer
      total:
        type: integer
      valid:
        type: integer
    type: object
  models.ValidationResponse:
    properties:
      error_code:
        type: string
      execution_time_ms:
        type: integer
      from_cache:
        type: boolean
      is_valid:
        type: boolean
      location_data:
        additionalProperties: true
        type: object
      message:
        type: string
      parameter_key:
        type: string
      parameter_value:
        type: string
      raw_parameter_value:
        type: string
      request_id:
        type: string
      status_code:
        type: integer
      timestamp:
        type: string
    type: object
info:
  contact: {}
paths:
  /validate:
    get:
      description: Validates different types of data, including email, CPF, name,
        phone, RG, CEP, and credit card number
      parameters:
      - description: Email to be validated
        in: query
        name: email
        type: string
      - description: CPF to be validated
        in: query
        name: cpf
        type: string
      - description: CNPJ to be validated
        in: query
        name: cnpj
        type: string
      - description: CPF or CNPJ, whichever the digits describe
        in: query
        name: documento
        type: string
      - description: PIS/PASEP/NIT/NIS to be validated
        in: query
        name: pis
        type: string
      - description: Voter registration number to be validated
        in: query
        name: titulo
        type: string
      - description: Vehicle plate, old or Mercosul pattern
        in: query
        name: placa
        type: string
      - description: Driving licence number to be validated
        in: query
        name: cnh
        type: string
      - description: Vehicle registration number, 9 or 11 digits
        in: query
        name: renavam
        type: string
      - description: Bank slip linha digitável, 47 digits
        in: query
        name: boleto
        type: string
      - description: PIX key in any of its five forms
        in: query
        name: pix
        type: string
      - description: State registration; requires uf
        in: query
        name: ie
        type: string
      - description: Two-letter state code qualifying ie
        in: query
        name: uf
        type: string
      - description: Name to be validated
        in: query
        name: name
        type: string
      - description: Phone number to be validated
        in: query
        name: telephone
        type: string
      - description: Phone number to be validated
        in: query
        name: phone
        type: string
      - description: Credit card number to be validated
        in: query
        name: plastic
        type: string
      - description: RG to be validated
        in: query
        name: rg
        type: string
      - description: CEP (postal code) to be validated
        in: query
        name: cep
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ValidationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ValidationResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/models.ValidationResponse'
      summary: Validates provided data format
      tags:
      - Validation
  /validate/batch:
    post:
      consumes:
      - application/json
      description: Checks a list of values, each with its own document type. Returns
        one result per item plus a summary.
      parameters:
      - description: Values to validate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.BatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.BatchResponse'
      summary: Validates several values in one request
      tags:
      - Validation
swagger: "2.0"

paths:
  /validate:
    get:
      description: Validates different types of data, including email, CPF, name,
        phone, RG, CEP, and credit card number
      parameters:
      - description: Email to be validated
        in: query
        name: email
        type: string
      - description: CPF to be validated
        in: query
        name: cpf
        type: string
      - description: CNPJ to be validated
        in: query
        name: cnpj
        type: string
      - description: CPF or CNPJ, whichever the digits describe
        in: query
        name: documento
        type: string
      - description: PIS/PASEP/NIT/NIS to be validated
        in: query
        name: pis
        type: string
      - description: Voter registration number to be validated
        in: query
        name: titulo
        type: string
      - description: Vehicle plate, old or Mercosul pattern
        in: query
        name: placa
        type: string
      - description: PIX key in any of its five forms
        in: query
        name: pix
        type: string
      - description: State registration; requires uf
        in: query
        name: ie
        type: string
      - description: Two-letter state code qualifying ie
        in: query
        name: uf
        type: string
      - description: Name to be validated
        in: query
        name: name
        type: string
      - description: Phone number to be validated
        in: query
        name: telephone
        type: string
      - description: Phone number to be validated
        in: query
        name: phone
        type: string
      - description: Credit card number to be validated
        in: query
        name: plastic
        type: string
      - description: RG to be validated
        in: query
        name: rg
        type: string
      - description: CEP (postal code) to be validated
        in: query
        name: cep
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ValidationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ValidationResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/models.ValidationResponse'
      summary: Validates provided data format
      tags:
      - Validation
swagger: "2.0"
